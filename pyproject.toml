[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "omm-model"
version = "0.3.18"
description = "Open source Model Manager - a package manager for local LLMs (GGUF)"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "typer>=0.12",
    "click>=8.1",
    "rich>=13",
    "psutil>=5.9",
    "requests>=2.31",
    "questionary>=2.0",
    "cryptography>=43",
    "filelock>=3.16",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "fastapi>=0.115",
    "httpx2>=2.12",
    "uvicorn>=0.30",
    "scikit-learn>=1.4",
]
server = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "uvicorn>=0.30",
]
# NVIDIA VRAM detection (hardware.py._scan_nvidia_vram already lazy-imports
# pynvml behind a broad try/except, so it's safe to omit entirely on
# machines without an NVIDIA GPU - e.g. every Mac).
nvidia = ["nvidia-ml-py>=12"]

[project.scripts]
omm = "omm.cli:main"
localfit-server = "localfit_server.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/omm", "src/localfit_server"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.venv*",
    "/venv*",
    "/cf-worker/node_modules",
    "/cf-worker/.wrangler",
    "/dist",
    "/build",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
