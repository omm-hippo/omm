version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/cf-worker"
    schedule:
      interval: "weekly"
    # One PR per ecosystem per week instead of one per package: the
    # single-package PRs touch the same lockfile / pinned requirements files,
    # so merging one restales the rest.
    groups:
      cf-worker:
        patterns: ["*"]
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    # Same grouping as cf-worker above.
    groups:
      pip:
        patterns: ["*"]
    ignore:
      # requirements-npm-binary.txt pins cryptography==48.0.0 on darwin-x64 on
      # purpose (49.0.0+ drops the Intel macOS wheel; bumping breaks the frozen
      # npm binary). Dependabot can't target one exception line in one file, so
      # it keeps reopening PRs that break that pin and desync
      # requirements-windows-portable.txt. Alerts for this range are dismissed
      # not_used (cryptography.x509.verification only; omm only uses Ed25519
      # verify). Bump cryptography by hand when the wheel situation changes.
      - dependency-name: "cryptography"
