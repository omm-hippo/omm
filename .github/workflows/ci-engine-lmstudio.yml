name: "Engine link/import check: LM Studio"

"on":
  push:
    paths:
      - "src/omm/linker.py"
      - "src/omm/config.py"
      - "src/omm/atomic.py"
      - "src/omm/hardware.py"
      - "src/omm/scan_import.py"
      - "src/omm/hashutil.py"
      - "scripts/verify_engine_link.py"
      - ".github/workflows/ci-engine-lmstudio.yml"
  pull_request:
    paths:
      - "src/omm/linker.py"
      - "src/omm/config.py"
      - "src/omm/atomic.py"
      - "src/omm/hardware.py"
      - "src/omm/scan_import.py"
      - "src/omm/hashutil.py"
      - "scripts/verify_engine_link.py"
      - ".github/workflows/ci-engine-lmstudio.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    name: Real llmster/lms install + omm link/import + recognition (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install omm
        run: python -m pip install -e .
      - name: Install, link, import, and verify LM Studio (llmster) recognizes both directions
        # _install_lmstudio installs llmster - LM Studio's headless
        # CLI+daemon core, not the GUI app - so this needs no display.
        run: python scripts/verify_engine_link.py lmstudio
