name: "Engine link/import check: LM Studio"

"on":
  push:
    branches:
      - "main"
      - "beta"
    paths:
      - "pyproject.toml"
      - "src/omm/linker.py"
      - "src/omm/config.py"
      - "src/omm/atomic.py"
      - "src/omm/hardware.py"
      - "src/omm/scan_import.py"
      - "src/omm/registry.py"
      - "src/omm/hashutil.py"
      - "scripts/verify_engine_link.py"
      - ".github/workflows/ci-engine-lmstudio.yml"
  pull_request:
    paths:
      - "pyproject.toml"
      - "src/omm/linker.py"
      - "src/omm/config.py"
      - "src/omm/atomic.py"
      - "src/omm/hardware.py"
      - "src/omm/scan_import.py"
      - "src/omm/registry.py"
      - "src/omm/hashutil.py"
      - "scripts/verify_engine_link.py"
      - ".github/workflows/ci-engine-lmstudio.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  verify:
    name: LM Studio layout fixture + omm link/import contract (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install omm
        run: python -m pip install -e .
      - name: Link, import, and verify the LM Studio model-layout contract
        # Linux automated installation is unsupported; use an inert nested
        # model-layout fixture. This does not claim lms/daemon verification.
        run: python scripts/verify_engine_link.py lmstudio --filesystem-fixture
