name: "Engine link/import check: Ollama"

"on":
  push:
    paths:
      - "pyproject.toml"
      - "src/omm/linker.py"
      - "src/omm/config.py"
      - "src/omm/atomic.py"
      - "src/omm/hardware.py"
      - "src/omm/scan_import.py"
      - "src/omm/registry.py"
      - "src/omm/gguf.py"
      - "src/omm/hashutil.py"
      - "scripts/verify_engine_link.py"
      - ".github/workflows/ci-engine-ollama.yml"
  pull_request:
    paths:
      - "pyproject.toml"
      - "src/omm/linker.py"
      - "src/omm/config.py"
      - "src/omm/atomic.py"
      - "src/omm/hardware.py"
      - "src/omm/scan_import.py"
      - "src/omm/registry.py"
      - "src/omm/gguf.py"
      - "src/omm/hashutil.py"
      - "scripts/verify_engine_link.py"
      - ".github/workflows/ci-engine-ollama.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    name: Ollama store fixture + omm link/import contract (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install omm
        run: python -m pip install -e .
      - name: Link, import, and verify the Ollama store contract
        # Linux automated installation is intentionally unsupported by the
        # product installer. This inert store fixture verifies manifest/blob
        # layout and import behavior, not a real Ollama daemon.
        run: python scripts/verify_engine_link.py ollama --filesystem-fixture
