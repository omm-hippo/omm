name: Train recommendation model

"on":
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.LOCALFIT_RETRAIN_PAT }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install omm + training deps
        run: |
          pip install -e .
          pip install -r requirements-train.txt

      - name: Preflight protected telemetry access
        env:
          LOCALFIT_TELEMETRY_EXPORT_URL: ${{ secrets.LOCALFIT_TELEMETRY_EXPORT_URL }}
          LOCALFIT_ADMIN_TOKEN: ${{ secrets.LOCALFIT_ADMIN_TOKEN }}
        run: |
          test -n "$LOCALFIT_TELEMETRY_EXPORT_URL" || { echo "LOCALFIT_TELEMETRY_EXPORT_URL is required"; exit 1; }
          if ! python -c 'import os; from urllib.parse import urlparse; p = urlparse(os.environ["LOCALFIT_TELEMETRY_EXPORT_URL"]); h = (p.hostname or "").lower(); raise SystemExit(not ((h.endswith(".firebaseio.com") or h.endswith(".firebasedatabase.app")) and p.path.endswith(".json")))'; then
            test -n "$LOCALFIT_ADMIN_TOKEN" || { echo "LOCALFIT_ADMIN_TOKEN is required for self-hosted telemetry"; exit 1; }
          fi
          cp published/localfit-recommend-model.json "$RUNNER_TEMP/localfit-incumbent.json"

      - name: Fetch HuggingFace candidate pool
        run: python scripts/fetch_candidates.py

      - name: Train and quality-gate candidate model
        id: train
        env:
          LOCALFIT_TELEMETRY_EXPORT_URL: ${{ secrets.LOCALFIT_TELEMETRY_EXPORT_URL }}
          LOCALFIT_ADMIN_TOKEN: ${{ secrets.LOCALFIT_ADMIN_TOKEN }}
        run: |
          python scripts/train_model.py \
            --telemetry-url "$LOCALFIT_TELEMETRY_EXPORT_URL" \
            --quality-gate \
            --minimum-real-configurations 100 \
            --baseline "$RUNNER_TEMP/localfit-incumbent.json" \
            --output "$RUNNER_TEMP/localfit-candidate.json" \
            --quality-report "$RUNNER_TEMP/localfit-quality-report.json"
          python scripts/retrain_decision.py \
            --quality-report "$RUNNER_TEMP/localfit-quality-report.json" \
            --candidate "$RUNNER_TEMP/localfit-candidate.json" \
            --incumbent "$RUNNER_TEMP/localfit-incumbent.json" \
            --github-output "$GITHUB_OUTPUT"
          cp "$RUNNER_TEMP/localfit-candidate.json" published/localfit-recommend-model.json

      - name: Sign published catalog
        if: >-
          steps.train.outputs.quality_gate_status == 'passed' &&
          steps.train.outputs.model_changed == 'true'
        env:
          LOCALFIT_CATALOG_SIGNING_KEY: ${{ secrets.LOCALFIT_CATALOG_SIGNING_KEY }}
        run: |
          umask 077
          key_path="$RUNNER_TEMP/omm-catalog-signing-key"
          printf '%s\n' "$LOCALFIT_CATALOG_SIGNING_KEY" > "$key_path"
          python scripts/sign_catalog.py sign published/localfit-recommend-model.json \
            --private "$key_path" \
            --manifest published/localfit-recommend-model.manifest.json

      - name: Open a PR with the retrained model and auto-merge it
        env:
          GH_TOKEN: ${{ secrets.LOCALFIT_RETRAIN_PAT }}
          LOCALFIT_RETRAIN_SSH_KEY: ${{ secrets.LOCALFIT_RETRAIN_SSH_KEY }}
          QUALITY_GATE_STATUS: ${{ steps.train.outputs.quality_gate_status }}
          MODEL_CHANGED: ${{ steps.train.outputs.model_changed }}
          COMMIT_MESSAGE: ${{ steps.train.outputs.commit_message }}
          PR_TITLE: ${{ steps.train.outputs.pr_title }}
          PR_BODY: ${{ steps.train.outputs.pr_body }}
        run: |
          if [ "$QUALITY_GATE_STATUS" != "passed" ] && [ "$MODEL_CHANGED" != "false" ]; then
            echo "Quality gate reported $QUALITY_GATE_STATUS but changed the published model." >&2
            exit 1
          fi

          git config user.name "omm-retrain-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add published/localfit-recommend-model.json published/candidates.json
          git diff --cached --quiet && echo "No changes, skipping." && exit 0
          git add published/localfit-recommend-model.manifest.json

          # Sign with the bot's own key (listed in src/omm/trust/allowed_signers)
          # rather than GITHUB_TOKEN, so the PR head passes the Trusted PR head
          # check like any other contributor's commit.
          umask 077
          key_path="$RUNNER_TEMP/omm-retrain-signing-key"
          printf '%s\n' "$LOCALFIT_RETRAIN_SSH_KEY" > "$key_path"
          chmod 600 "$key_path"
          git config gpg.format ssh
          git config commit.gpgsign true
          git config user.signingkey "$key_path"

          branch="retrain/$(date -u +%Y%m%d-%H%M%S)"
          git checkout -b "$branch"
          git commit -m "$COMMIT_MESSAGE"

          # Branch protection blocks direct pushes to main (no bypass, even for
          # admins), so land the update through a normal PR instead.
          git push origin "$branch"
          pr_url=$(gh pr create \
            --title "$PR_TITLE" \
            --body "$PR_BODY" \
            --base main --head "$branch")
          gh pr merge "$pr_url" --auto --merge
