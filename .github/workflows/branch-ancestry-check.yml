name: Branch ancestry check

"on":
  push:
    branches:
      - "main"
      - "beta"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: branch-ancestry-check
  cancel-in-progress: true

jobs:
  main-ancestor-of-beta:
    name: main must be an ancestor of beta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check that beta contains every commit on main
        run: |
          set -euo pipefail
          # beta is the trunk; main only ever fast-forwards to a commit that
          # already exists on beta (scripts/cut_release.py). So main is an
          # ancestor of beta by construction - this check can only fail on
          # operator error during a release cut (a non-fast-forward push, or
          # main pushed to a commit not on beta). A single check, no polling:
          # there is no sync race any more.
          #
          # A real divergence breaks omm's update-channel signature
          # verification (verify_update in src/omm/trust/__init__.py walks
          # first-parent forward from a shared ancestor).
          git fetch --quiet origin main beta
          if git merge-base --is-ancestor origin/main origin/beta; then
            echo "beta contains every commit on main."
            exit 0
          fi
          echo "::error::main is not an ancestor of beta - the branches have diverged."
          echo "main must only ever fast-forward to a commit already on beta."
          echo "If a release cut pushed the wrong commit, reset main:"
          echo "  git push origin <good-beta-sha>:main   # fast-forward only"
          exit 1
