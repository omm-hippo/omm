name: "Engine link/import check: KoboldCpp"

"on":
  push:
    branches:
      - "main"
      - "beta"
    paths:
      - "pyproject.toml"
      - "src/omm/linker.py"
      - "src/omm/config.py"
      - "src/omm/atomic.py"
      - "src/omm/hardware.py"
      - "src/omm/scan_import.py"
      - "src/omm/registry.py"
      - "src/omm/hashutil.py"
      - "scripts/verify_engine_link.py"
      - ".github/workflows/ci-engine-koboldcpp.yml"
  pull_request:
    paths:
      - "pyproject.toml"
      - "src/omm/linker.py"
      - "src/omm/config.py"
      - "src/omm/atomic.py"
      - "src/omm/hardware.py"
      - "src/omm/scan_import.py"
      - "src/omm/registry.py"
      - "src/omm/hashutil.py"
      - "scripts/verify_engine_link.py"
      - ".github/workflows/ci-engine-koboldcpp.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  verify:
    name: KoboldCpp layout fixture + omm link/import contract (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install omm
        run: python -m pip install -e .
      - name: Link, import, and verify KoboldCpp's models-dir contract
        # KoboldCpp never auto-scans its models dir (it has to be launched
        # with --admindir pointed at it) - so recognition here means the
        # file lands exactly where a real launch would expect it, not a
        # live daemon call. See verify_engine_link.py's _verify_via_path.
        # Upstream release assets are mutable and have no pinned SHA-256, so
        # product code intentionally has no automated installer. Use an inert
        # executable-layout fixture; this does not claim real binary/runtime verification.
        run: python scripts/verify_engine_link.py koboldcpp --filesystem-fixture
