name: Cross-platform validation

"on":
  push:
    branches:
      - "main"
      - "beta"
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  windows-install-script:
    name: Windows PowerShell script syntax
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Parse installer and uninstaller with Windows PowerShell 5.1
        shell: pwsh
        run: |
          foreach ($name in @("install.ps1", "uninstall.ps1")) {
            powershell.exe -NoLogo -NoProfile -NonInteractive -Command "
              `$tokens = `$null
              `$errors = `$null
              [System.Management.Automation.Language.Parser]::ParseFile(
                (Join-Path '$PWD' '$name'), [ref]`$tokens, [ref]`$errors
              ) | Out-Null
              if (`$errors.Count -gt 0) {
                `$errors | ForEach-Object { Write-Error `$_ }
                exit 1
              }
            "
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }
      - name: Smoke-test safe PowerShell purge
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "omm-uninstall-smoke"
          $managed = Join-Path $root "custom-home"
          $stub = Join-Path $root "bin"
          New-Item -ItemType Directory -Force -Path (Join-Path $managed "models"), $stub | Out-Null
          Set-Content -LiteralPath (Join-Path $managed ".omm-managed") -Value "omm installer managed home v1" -Encoding Ascii
          Set-Content -LiteralPath (Join-Path $managed "config.json") -Value "{}" -Encoding Ascii
          Set-Content -LiteralPath (Join-Path $managed "keep-me.txt") -Value "user-owned" -Encoding Ascii
          Set-Content -LiteralPath (Join-Path $stub "python.cmd") -Value "@exit /b 1" -Encoding Ascii
          $env:PATH = "$stub;$env:PATH"
          $env:OMM_HOME = $managed
          & .\uninstall.ps1 -Purge
          if ($LASTEXITCODE -ne 0) { throw "handled pipx failure leaked exit code $LASTEXITCODE" }
          if (Test-Path -LiteralPath (Join-Path $managed "models")) { throw "models survived purge" }
          if (Test-Path -LiteralPath (Join-Path $managed "config.json")) { throw "config survived purge" }
          if (-not (Test-Path -LiteralPath (Join-Path $managed "keep-me.txt"))) { throw "user file was removed" }

  posix-install-scripts:
    name: POSIX installer syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Parse installer, uninstaller, and version hook
        run: |
          sh -n install.sh
          sh -n uninstall.sh
          sh -n scripts/pre-commit
      - name: Smoke-test safe POSIX purge
        run: |
          root=$(mktemp -d)
          managed="$root/custom-home"
          stub="$root/bin"
          mkdir -p "$managed/models" "$stub"
          printf '%s\n' 'omm installer managed home v1' > "$managed/.omm-managed"
          printf '%s\n' '{}' > "$managed/config.json"
          printf '%s\n' 'user-owned' > "$managed/keep-me.txt"
          printf '%s\n' '#!/bin/sh' 'exit 1' > "$stub/python3"
          printf '%s\n' '#!/bin/sh' 'exit 1' > "$stub/python"
          printf '%s\n' '#!/bin/sh' 'exit 1' > "$stub/pipx"
          chmod +x "$stub/python3" "$stub/python" "$stub/pipx"
          PATH="$stub:$PATH" OMM_HOME="$managed" sh ./uninstall.sh --purge
          test ! -e "$managed/models"
          test ! -e "$managed/config.json"
          test -e "$managed/keep-me.txt"

  python:
    name: Python 3.12 on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Localfit test dependencies
        run: python -m pip install -e ".[dev]" -r requirements-train.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Verify CLI entry point
        run: omm --help

  python-windows:
    # One windows-latest runner needs ~17 minutes for the suite that Linux
    # finishes in 3, and it is the long pole of every pull request. Run it
    # as four parallel slices (tests/conftest.py reads OMM_TEST_SHARD) and
    # let the gate job below carry the check name branch protection requires.
    name: Windows tests (shard ${{ matrix.shard }}/4)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Localfit test dependencies
        run: python -m pip install -e ".[dev]" -r requirements-train.txt
      - name: Run tests
        env:
          OMM_TEST_SHARD: ${{ matrix.shard }}/4
        run: python -m pytest -q --durations=15 --durations-min=2
      - name: Verify CLI entry point
        run: omm --help

  python-windows-gate:
    # Keeps the single "Python 3.12 on windows-latest" context that the main
    # branch protection rule requires, now backed by the four shards above.
    name: Python 3.12 on windows-latest
    needs: python-windows
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every Windows shard succeeded
        env:
          RESULT: ${{ needs.python-windows.result }}
        run: |
          echo "Windows shards: $RESULT"
          test "$RESULT" = "success"

  non-ascii-path:
    name: Tests from a non-ASCII path
    runs-on: ubuntu-latest
    steps:
      # omm writes UTF-8 everywhere, but text I/O that omits `encoding=`
      # decodes with the platform default instead - cp949 on a Korean
      # Windows install. The run log records the working directory, so a
      # checkout under a non-ASCII path is enough to surface the whole
      # class. Keep this job checked out somewhere the ASCII jobs are not.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: "작업 공간/omm"
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "작업 공간/omm/pyproject.toml"
      - name: Install Localfit test dependencies
        working-directory: "작업 공간/omm"
        run: python -m pip install -e ".[dev]" -r requirements-train.txt
      - name: Reject text I/O that leaves the encoding to the platform
        working-directory: "작업 공간/omm"
        run: python scripts/check_text_encoding.py
      - name: Run tests
        working-directory: "작업 공간/omm"
        run: python -m pytest -q
      - name: Verify CLI entry point
        working-directory: "작업 공간/omm"
        run: omm --help

  bare-install:
    name: Verify CLI with only declared runtime dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install omm with no dev/server extras (mirrors a real pipx/curl install)
        run: python -m pip install -e .
      - name: Verify CLI entry point imports and runs cleanly
        run: omm --help

  docs-sync:
    name: Command docs in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install omm with only its runtime dependencies
        run: python -m pip install -e .
      - name: Compare the CLI against docs/commands.json, README Usage, and omm.run
        run: python scripts/check_docs_sync.py

  docker:
    name: Reproducible Linux container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build test image
        run: docker build --tag localfit-test .
      - name: Run test image
        run: docker run --rm localfit-test
      - name: Pull pinned Python coding sandbox image
        run: >-
          docker pull
          docker.io/library/python:3.12.10-alpine3.21@sha256:9c51ecce261773a684c8345b2d4673700055c513b4d54bc0719337d3e4ee552e
      - name: Verify generated-code sandbox boundaries
        env:
          PYTHONPATH: src
        run: python scripts/verify_coding_sandbox.py

  firebase-rules:
    name: Firebase rules emulator
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: "22"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Compile rules and run authorization scenarios
        run: >-
          npx --yes firebase-tools@15.24.0 emulators:exec
          --only database
          --project demo-localfit
          "node scripts/test_firebase_rules.mjs"

  cf-worker:
    name: Telemetry gateway (cf-worker) tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cf-worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cf-worker/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Reject high-severity dependency vulnerabilities
        run: npm audit --audit-level=high
      - name: Run vitest
        run: npm test
      - name: Type-check
        run: npx tsc -p tsconfig.json

  homebrew-formula:
    name: Homebrew Formula matches the runtime dependency graph
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out the Homebrew Tap (read-only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: omm-hippo/homebrew-omm
          path: homebrew-omm
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the marker evaluator
        run: python -m pip install --disable-pip-version-check packaging
      - name: Compare Formula/omm.rb against requirements-npm-binary.txt (issue #238)
        run: >-
          python scripts/homebrew_formula.py check
          --formula homebrew-omm/Formula/omm.rb
          --version "$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          --allow-version-lag
