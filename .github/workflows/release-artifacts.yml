name: Release artifact validation

"on":
  workflow_dispatch: {}
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - ".github/workflows/release-artifacts.yml"
      - "pyproject.toml"
      - "requirements-release.txt"
      - "src/**"
      - "scripts/release_artifacts.py"
      - "tests/test_release_artifacts.py"
      - "LICENSE"
      - "README.md"

permissions:
  contents: read

concurrency:
  group: release-artifacts-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build wheel and source archive
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install pinned release tools
        run: python -m pip install --disable-pip-version-check --no-input -r requirements-release.txt
      - name: Require release tags to point into main history
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
      - name: Require tag and project version to match
        if: startsWith(github.ref, 'refs/tags/')
        run: python scripts/release_artifacts.py check-tag --tag "${GITHUB_REF_NAME}"
      - name: Build archives
        run: python -m build
      - name: Validate package metadata
        run: |
          python -m twine check dist/*.whl dist/*.tar.gz
          python scripts/release_artifacts.py verify-dist --dist-dir dist
      - name: Generate and verify checksums
        run: |
          python scripts/release_artifacts.py write-checksums --dist-dir dist
          python scripts/release_artifacts.py verify-checksums --dist-dir dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-release-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14

  smoke-install:
    name: Install wheel on ${{ matrix.os }} / Python ${{ matrix.python }}
    needs: build
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-release-dist
          path: dist
      - name: Verify checksums and install the built wheel
        run: python scripts/release_artifacts.py smoke-install --dist-dir dist
