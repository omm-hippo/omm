name: "Engine link/import check: Msty"

"on":
  push:
    branches:
      - "main"
      - "beta"
    paths:
      - "pyproject.toml"
      - "src/omm/linker.py"
      - "src/omm/config.py"
      - "src/omm/atomic.py"
      - "src/omm/hardware.py"
      - "src/omm/scan_import.py"
      - "src/omm/registry.py"
      - "src/omm/hashutil.py"
      - "scripts/verify_engine_link.py"
      - ".github/workflows/ci-engine-mstystudio.yml"
  pull_request:
    paths:
      - "pyproject.toml"
      - "src/omm/linker.py"
      - "src/omm/config.py"
      - "src/omm/atomic.py"
      - "src/omm/hardware.py"
      - "src/omm/scan_import.py"
      - "src/omm/registry.py"
      - "src/omm/hashutil.py"
      - "scripts/verify_engine_link.py"
      - ".github/workflows/ci-engine-mstystudio.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  verify:
    name: Real Msty (brew cask) install + omm link/import + filesystem recognition (macos-latest)
    # brew cask is the only automated install path at all for Msty - no
    # winget package targets current "Msty Studio" (only the deprecated
    # pre-rebrand app), and no Linux package manager exists. macos-latest
    # is the only runner OS this can use.
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install omm
        run: python -m pip install -e .
      - name: Install, link, import, and verify Msty's models dir in both directions
        run: python scripts/verify_engine_link.py mstystudio
