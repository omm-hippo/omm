name: Build, verify, and publish Python release

"on":
  workflow_dispatch: {}
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "pyproject.toml"
      - "requirements-release.txt"
      - "requirements-train.txt"
      - "src/**"
      - "scripts/release_artifacts.py"
      - "scripts/pypi_release.py"
      - "tests/test_release_artifacts.py"
      - "tests/test_pypi_release.py"
      - "docs/homebrew-release-sync.md"
      - "LICENSE"
      - "README.md"

permissions:
  contents: read

concurrency:
  group: python-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build wheel and source archive
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.release_identity.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install pinned release tools
        run: python -m pip install --disable-pip-version-check --no-input -r requirements-release.txt
      - name: Verify the signed release identity
        if: startsWith(github.ref, 'refs/tags/')
        run: python scripts/release_artifacts.py verify-release --tag "${GITHUB_REF_NAME}"
      - name: Expose the verified release version
        id: release_identity
        if: startsWith(github.ref, 'refs/tags/')
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Build archives
        run: python -m build
      - name: Validate package metadata
        run: |
          python -m twine check dist/*.whl dist/*.tar.gz
          python scripts/release_artifacts.py verify-dist --dist-dir dist
      - name: Generate and verify checksums
        run: |
          python scripts/release_artifacts.py write-checksums --dist-dir dist
          python scripts/release_artifacts.py verify-checksums --dist-dir dist
      - name: Store validation bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-release-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: Store publish-only packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-release-packages
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  smoke-install:
    name: Install wheel on ${{ matrix.os }} / Python ${{ matrix.python }}
    needs: build
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-release-dist
          path: dist
      - name: Verify checksums and install the built wheel
        run: python scripts/release_artifacts.py smoke-install --dist-dir dist

  release-tests:
    name: Release gate on ${{ matrix.os }}
    needs: smoke-install
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # 3.12: the 2026-09-06 dependency freeze pins the dev extra to
          # numpy/scipy versions that only publish wheels for >=3.12.
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check --no-input -e ".[dev]" -r requirements-train.txt
      - name: Run the complete Python suite
        run: python -m pytest -q

  publish-testpypi:
    name: Publish packages to TestPyPI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [smoke-install, release-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/p/omm-model
    permissions:
      id-token: write
    steps:
      - name: Download publish-only packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-release-packages
          path: pypi-dist
      - name: Publish packages to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: pypi-dist/
          attestations: true
          verify-metadata: true
          skip-existing: true

  verify-testpypi:
    name: Verify TestPyPI files, provenance, and install
    needs: publish-testpypi
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-release-dist
          path: dist
      - name: Install the attestation verifier
        run: python -m pip install --disable-pip-version-check --no-input pypi-attestations==0.0.30
      - name: Verify destination files and SHA-256 digests
        run: >-
          python scripts/pypi_release.py verify-index
          --repository-url https://test.pypi.org
          --dist-dir dist
      - name: Verify TestPyPI publish attestations
        run: >-
          python scripts/pypi_release.py verify-attestations
          --repository-url https://test.pypi.org
          --dist-dir dist
      - name: Install OMM back from TestPyPI
        run: >-
          python scripts/pypi_release.py smoke-index-install
          --repository-url https://test.pypi.org
          --index-url https://test.pypi.org/simple/
          --dist-dir dist

  publish-pypi:
    name: Publish packages to PyPI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: verify-testpypi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/omm-model
    permissions:
      id-token: write
    steps:
      - name: Download publish-only packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-release-packages
          path: pypi-dist
      - name: Publish packages to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: pypi-dist/
          attestations: true
          verify-metadata: true
          # A rerun after a successful upload must still reach the exact-byte
          # and attestation verification jobs below. They fail closed if an
          # existing release does not match this run's validated artifacts.
          skip-existing: true

  verify-pypi-files:
    name: Verify PyPI files and provenance
    needs: publish-pypi
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-release-dist
          path: dist
      - name: Install the attestation verifier
        run: python -m pip install --disable-pip-version-check --no-input pypi-attestations==0.0.30
      - name: Verify destination files and SHA-256 digests
        run: >-
          python scripts/pypi_release.py verify-index
          --repository-url https://pypi.org
          --dist-dir dist
      - name: Verify PyPI publish attestations
        run: >-
          python scripts/pypi_release.py verify-attestations
          --repository-url https://pypi.org
          --dist-dir dist

  verify-pypi-install:
    name: Verify PyPI pipx path on ${{ matrix.os }}
    needs: verify-pypi-files
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install pinned pipx
        run: python -m pip install --disable-pip-version-check --no-input pipx==1.16.7
      - name: Install, run, and uninstall the public package
        run: >-
          python scripts/pypi_release.py pipx-smoke
          --index-url https://pypi.org/simple/

  sync-homebrew:
    name: Request asynchronous Homebrew Formula synchronization
    needs: verify-pypi-install
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require the cross-repository dispatch token
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_DISPATCH_TOKEN }}
        run: |
          if [[ -z "${GH_TOKEN}" ]]
          then
            echo "::error::HOMEBREW_TAP_DISPATCH_TOKEN is not configured"
            exit 1
          fi
      - name: Notify the Homebrew Tap of the verified PyPI release
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_DISPATCH_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh api --method POST \
            "repos/omm-hippo/homebrew-omm/dispatches" \
            -f event_type=pypi_release_verified \
            -f "client_payload[version]=${version}" \
            -f "client_payload[tag]=${GITHUB_REF_NAME}" \
            -f "client_payload[source_repository]=${GITHUB_REPOSITORY}" \
            -f "client_payload[source_sha]=${GITHUB_SHA}" \
            -f "client_payload[source_run_id]=${GITHUB_RUN_ID}"

  publish-github-release:
    name: Add Python artifacts to the draft GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, verify-pypi-install]
    permissions:
      contents: write
    uses: ./.github/workflows/github-release.yml
    with:
      version: ${{ needs.build.outputs.version }}
      asset_set: python
