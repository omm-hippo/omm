# Throwaway diagnostic workflow for issue #237.
#
# The `Verify public npm path on win32-x64` job in `npm-release.yml` fails
# post-publish only on the `windows-2025` runner ("npm-installed OMM reported the
# wrong version"). A teammate could not reproduce it on a real Windows 11 x64
# box, and the `v0.3.33` release job checks out the tag commit, which predates
# the #242 diagnostics. This workflow runs the same registry smoke against the
# already-published `0.3.33` from `main` (so the #242 `_install_tree` dump is
# present) and prints the raw environment + installed tree regardless of the
# outcome, so the actual cause shows up in the log without a manual repro.
#
# Delete this file once #237 is understood.
name: "debug: win32-x64 npm path (#237)"

"on":
  workflow_dispatch:
    inputs:
      version:
        description: Published OMM version to probe, without the v prefix
        required: false
        default: "0.3.33"
        type: string

permissions:
  contents: read

jobs:
  probe:
    name: Probe the public npm win32-x64 path
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      OMM_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: | # zizmor: ignore[adhoc-packages] exact verification CLI version
          npm install --global npm@11.19.0

      - name: Environment
        shell: pwsh
        run: |
          node --version
          npm --version
          npm config get cache
          "PATH entries:"
          $env:PATH -split ';'
          "omm already on PATH:"
          Get-Command omm -All -ErrorAction SilentlyContinue | Format-Table -AutoSize
          "npm resolves to:"
          Get-Command npm -All -ErrorAction SilentlyContinue | Format-Table -AutoSize

      - name: Manual registry install repro
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Path p | Out-Null
          npm install --global --prefix .\p --ignore-scripts --no-audit --no-fund `
            --registry https://registry.npmjs.org/ "@omm-hippo/omm@$env:OMM_VERSION"
          "--- npm ls --global --prefix .\p --all --depth 2 ---"
          npm ls --global --prefix .\p --all --depth 2
          "--- .\p tree ---"
          Get-ChildItem -Recurse -Depth 3 .\p | Select-Object FullName
          "--- .\p\omm.cmd --version ---"
          & .\p\omm.cmd --version
          "--- .\p\omm.ps1 --version ---"
          if (Test-Path .\p\omm.ps1) { & .\p\omm.ps1 --version }
          "--- node resolve of the launcher target ---"
          node -e "try{console.log(require.resolve('@omm-hippo/omm-win32-x64/package.json',{paths:['./p/node_modules/@omm-hippo/omm']}))}catch(e){console.log(String(e))}"

      - name: Registry smoke with #242 diagnostics
        shell: pwsh
        run: |
          python scripts/npm_release.py smoke-registry --version $env:OMM_VERSION --target win32-x64
