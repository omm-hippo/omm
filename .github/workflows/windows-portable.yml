name: Build Windows portable release

"on":
  workflow_dispatch:
    inputs:
      version:
        description: Existing signed OMM release version, without the v prefix
        required: true
        type: string
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - ".github/workflows/github-release.yml"
      - ".github/workflows/windows-portable.yml"
      - "pyproject.toml"
      - "requirements-windows-portable.txt"
      - "scripts/winget_manifest.py"
      - "scripts/windows_portable.py"
      - "scripts/release_artifacts.py"
      - "src/**"
      - "tests/test_winget_manifest.py"
      - "tests/test_windows_portable.py"
      - "tests/test_release_artifacts.py"
      - "LICENSE"

permissions:
  contents: read

concurrency:
  group: windows-portable-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and exercise Windows x64 portable package
    runs-on: windows-latest
    timeout-minutes: 35
    outputs:
      version: ${{ steps.identity.outputs.version }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out trusted packaging tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tooling
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the source being packaged
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/v{0}', inputs.version) || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          architecture: x64
      - name: Resolve and validate the packaged version
        id: identity
        shell: pwsh
        run: |
          $version = python tooling/scripts/windows_portable.py project-version --pyproject source/pyproject.toml
          if ($LASTEXITCODE -ne 0) { throw "project identity validation failed" }
          if ("${{ github.event_name }}" -eq "workflow_dispatch" -and $version -ne "${{ inputs.version }}") {
            throw "tag input ${{ inputs.version }} does not match project version $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Verify the signed tag and main ancestry
        if: github.event_name != 'pull_request'
        shell: pwsh
        working-directory: source
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
        run: |
          python ../tooling/scripts/release_artifacts.py verify-release `
            --tag $env:RELEASE_TAG `
            --repository .
          if ($LASTEXITCODE -ne 0) { throw "release identity verification failed" }
      - name: Install the pinned freezer and runtime graph
        run: >-
          python -m pip install --disable-pip-version-check --no-input
          -r tooling/requirements-windows-portable.txt
      - name: Build and install the exact source wheel
        shell: pwsh
        run: |
          python -m build --wheel --no-isolation --outdir wheelhouse source
          if ($LASTEXITCODE -ne 0) { throw "wheel build failed" }
          $wheels = @(Get-ChildItem -LiteralPath wheelhouse -Filter *.whl)
          if ($wheels.Count -ne 1) { throw "expected exactly one wheel" }
          python -m pip install --disable-pip-version-check --no-input --no-deps $wheels[0].FullName
          if ($LASTEXITCODE -ne 0) { throw "wheel install failed" }
      - name: Build the standalone command
        run: >-
          python tooling/scripts/windows_portable.py build
          --version "${{ steps.identity.outputs.version }}"
          --output-dir portable
      - name: Package and verify the winget archive
        shell: pwsh
        run: |
          python tooling/scripts/windows_portable.py package `
            --version "${{ steps.identity.outputs.version }}" `
            --executable portable/omm.exe `
            --license source/LICENSE `
            --output-dir release-assets
          if ($LASTEXITCODE -ne 0) { throw "portable packaging failed" }
          $archive = "release-assets/omm-windows-x64-${{ steps.identity.outputs.version }}.zip"
          python tooling/scripts/windows_portable.py verify `
            --version "${{ steps.identity.outputs.version }}" `
            --archive $archive
          if ($LASTEXITCODE -ne 0) { throw "portable archive verification failed" }
      - name: Reuse a verified immutable release asset on reruns
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version = "${{ steps.identity.outputs.version }}"
          $archiveName = "omm-windows-x64-$version.zip"
          $checksumName = "$archiveName.sha256"
          $releaseJson = (gh api "repos/$env:GH_REPO/releases/tags/v$version" 2>&1) | Out-String
          if ($LASTEXITCODE -ne 0) {
            if ($releaseJson -match "HTTP 404") {
              Write-Host "No GitHub Release exists yet; the new validated build remains authoritative."
              return
            }
            throw "could not inspect the existing GitHub Release: $releaseJson"
          }
          $release = $releaseJson | ConvertFrom-Json
          $archiveAssets = @($release.assets | Where-Object { $_.name -eq $archiveName })
          $checksumAssets = @($release.assets | Where-Object { $_.name -eq $checksumName })
          if ($archiveAssets.Count -eq 0 -and $checksumAssets.Count -eq 0) {
            Write-Host "No Windows release assets exist yet; the new validated build remains authoritative."
            return
          }
          if ($archiveAssets.Count -ne 1 -or $checksumAssets.Count -ne 1) {
            throw "the release must contain either neither asset or exactly one archive and checksum"
          }

          New-Item -ItemType Directory -Force -Path published-assets | Out-Null
          gh release download "v$version" --repo $env:GH_REPO `
            --pattern $archiveName --pattern $checksumName `
            --dir published-assets --clobber
          if ($LASTEXITCODE -ne 0) { throw "could not download the existing Windows release assets" }

          $publishedArchive = Join-Path published-assets $archiveName
          $publishedChecksum = Join-Path published-assets $checksumName
          $checksumLine = (Get-Content -LiteralPath $publishedChecksum -Raw).Trim()
          $checksumPattern = '^(?<hash>[0-9A-Fa-f]{64})  ' + [regex]::Escape($archiveName) + '$'
          if ($checksumLine -notmatch $checksumPattern) {
            throw "the published checksum file has an unexpected format"
          }
          $actualHash = (Get-FileHash -LiteralPath $publishedArchive -Algorithm SHA256).Hash
          if ($actualHash.ToLowerInvariant() -ne $Matches.hash.ToLowerInvariant()) {
            throw "the published archive does not match its checksum"
          }
          gh attestation verify $publishedArchive --repo $env:GH_REPO
          if ($LASTEXITCODE -ne 0) { throw "the published archive has no valid repository attestation" }

          Copy-Item -LiteralPath $publishedArchive -Destination "release-assets/$archiveName" -Force
          Copy-Item -LiteralPath $publishedChecksum -Destination "release-assets/$checksumName" -Force
          python tooling/scripts/windows_portable.py verify `
            --version $version `
            --archive "release-assets/$archiveName"
          if ($LASTEXITCODE -ne 0) { throw "the published archive failed structural verification" }
      - name: Scan the verified portable executable with Microsoft Defender
        shell: pwsh
        run: |
          $version = "${{ steps.identity.outputs.version }}"
          $archive = Resolve-Path "release-assets/omm-windows-x64-$version.zip"
          $scanRoot = Join-Path $env:RUNNER_TEMP "omm-defender-scan"
          if (Test-Path -LiteralPath $scanRoot) {
            Remove-Item -LiteralPath $scanRoot -Recurse -Force
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $scanRoot
          $executable = (Resolve-Path (Join-Path $scanRoot "omm.exe")).Path

          foreach ($command in @(
            "Get-MpComputerStatus",
            "Get-MpPreference",
            "Get-MpThreatDetection",
            "Remove-MpPreference",
            "Set-MpPreference"
          )) {
            if ($null -eq (Get-Command $command -ErrorAction SilentlyContinue)) {
              throw "Microsoft Defender command is unavailable: $command"
            }
          }

          $preference = Get-MpPreference
          foreach ($excludedRoot in @("C:\", "D:\")) {
            if ($preference.ExclusionPath -contains $excludedRoot) {
              Remove-MpPreference -ExclusionPath $excludedRoot
            }
          }
          Set-MpPreference `
            -DisableArchiveScanning $false `
            -DisableBehaviorMonitoring $false `
            -DisableIOAVProtection $false `
            -DisableRealtimeMonitoring $false `
            -PUAProtection Enabled

          $remainingExclusions = @(Get-MpPreference).ExclusionPath
          foreach ($excludedRoot in @("C:\", "D:\")) {
            if ($remainingExclusions -contains $excludedRoot) {
              throw "Microsoft Defender still excludes the scan volume: $excludedRoot"
            }
          }

          $platformCommands = @(
            Get-ChildItem `
              -Path "$env:ProgramData/Microsoft/Windows Defender/Platform/*/MpCmdRun.exe" `
              -ErrorAction SilentlyContinue |
              Sort-Object FullName -Descending
          )
          if ($platformCommands.Count -gt 0) {
            $mpCmdRun = $platformCommands[0].FullName
          } else {
            $mpCmdRun = "$env:ProgramFiles/Windows Defender/MpCmdRun.exe"
          }
          if (-not (Test-Path -LiteralPath $mpCmdRun -PathType Leaf)) {
            throw "Microsoft Defender command-line scanner is unavailable"
          }

          & $mpCmdRun -SignatureUpdate
          if ($LASTEXITCODE -ne 0) { throw "Microsoft Defender signature update failed" }
          $status = Get-MpComputerStatus
          $status |
            Select-Object AMServiceEnabled, AntivirusEnabled, AntivirusSignatureVersion, AntivirusSignatureLastUpdated |
            Format-List |
            Out-String |
            Write-Host
          if (-not $status.AMServiceEnabled -or -not $status.AntivirusEnabled) {
            throw "Microsoft Defender antivirus engine is not enabled"
          }

          $scanOutput = (& $mpCmdRun `
            -Scan `
            -ScanType 3 `
            -File $executable `
            -DisableRemediation 2>&1) | Out-String
          $scanExit = $LASTEXITCODE
          Write-Host $scanOutput
          $detections = @(
            Get-MpThreatDetection |
              Where-Object { ($_.Resources -join "`n") -like "*$executable*" }
          )
          if ($detections.Count -gt 0) {
            $detections |
              Select-Object ThreatID, ThreatStatusID, InitialDetectionTime, Resources |
              Format-List |
              Out-String |
              Write-Host
          }
          if ($scanExit -eq 2 -or $detections.Count -gt 0) {
            throw "Microsoft Defender detected the verified OMM executable"
          }
          if ($scanExit -ne 0) {
            throw "Microsoft Defender scan failed with exit code $scanExit"
          }
      - name: Generate and validate the WinGet manifest set
        shell: pwsh
        run: |
          $version = "${{ steps.identity.outputs.version }}"
          $archive = "release-assets/omm-windows-x64-$version.zip"
          $releaseDate = git -C source show -s --format=%cs HEAD
          if ($LASTEXITCODE -ne 0) { throw "could not resolve the release date" }
          $installerUrl = "https://github.com/omm-hippo/omm/releases/download/v$version/omm-windows-x64-$version.zip"
          python tooling/scripts/winget_manifest.py `
            --version $version `
            --archive $archive `
            --release-date $releaseDate `
            --installer-url $installerUrl `
            --output-dir release-assets/winget
          if ($LASTEXITCODE -ne 0) { throw "WinGet manifest generation failed" }
          $manifestPath = "release-assets/winget/manifests/o/OmmHippo/OMM/$version"
          $winget = Get-Command winget -ErrorAction SilentlyContinue
          if ($null -eq $winget) { throw "winget is unavailable on this Windows runner" }
          winget --version
          $validationOutput = (& winget validate --manifest $manifestPath 2>&1) | Out-String
          $validationExit = $LASTEXITCODE
          Write-Host $validationOutput
          if ($validationExit -eq 0) {
            if ($validationOutput -notmatch "Manifest validation succeeded") {
              throw "winget did not confirm manifest validation"
            }
          } else {
            if ($validationOutput -notmatch "Manifest validation succeeded with warnings") {
              throw "winget rejected the generated manifest"
            }
            $warningLines = @(
              $validationOutput -split "`r?`n" |
                Where-Object { $_ -like "Manifest Warning:*" }
            )
            if ($warningLines.Count -ne 3) {
              throw "expected exactly three schema compatibility warnings: $validationOutput"
            }
            foreach ($warning in $warningLines) {
              if ($warning -notmatch "schema header URL does not match the expected pattern") {
                throw "unexpected winget validation warning: $warning"
              }
            }
            winget validate --manifest $manifestPath --ignore-warnings
            if ($LASTEXITCODE -ne 0) { throw "winget schema validation failed" }
          }
      - name: Exercise the archive from a winget-shaped path
        shell: pwsh
        run: |
          $installRoot = Join-Path $env:RUNNER_TEMP "Microsoft/WinGet/Packages/OmmHippo.OMM_Source"
          $dataRoot = Join-Path $env:RUNNER_TEMP "omm-portable-data"
          New-Item -ItemType Directory -Force -Path $installRoot, $dataRoot | Out-Null
          Expand-Archive `
            -LiteralPath "release-assets/omm-windows-x64-${{ steps.identity.outputs.version }}.zip" `
            -DestinationPath $installRoot
          $command = Join-Path $installRoot "omm.exe"
          & $command --version
          if ($LASTEXITCODE -ne 0) { throw "version probe failed" }
          & $command --help
          if ($LASTEXITCODE -ne 0) { throw "help probe failed" }
          Set-Content -LiteralPath (Join-Path $dataRoot "preserve-me") -Value "user data"
          $env:OMM_HOME = $dataRoot
          $startInfo = [System.Diagnostics.ProcessStartInfo]::new()
          $startInfo.FileName = $command
          $startInfo.ArgumentList.Add("update")
          $startInfo.UseShellExecute = $false
          $startInfo.RedirectStandardOutput = $true
          $startInfo.RedirectStandardError = $true
          $process = [System.Diagnostics.Process]::new()
          $process.StartInfo = $startInfo
          if (-not $process.Start()) { throw "could not start the update probe" }
          $updateOutput = $process.StandardOutput.ReadToEnd() + $process.StandardError.ReadToEnd()
          $process.WaitForExit()
          if ($process.ExitCode -eq 0) { throw "package-managed update unexpectedly mutated the install" }
          if ($updateOutput -notmatch "winget upgrade --id OmmHippo.OMM -e") {
            throw "winget update guidance was not reported: $updateOutput"
          }
          if (-not (Test-Path -LiteralPath (Join-Path $dataRoot "preserve-me"))) {
            throw "package probe removed user data"
          }
      - name: Upload the validated portable bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-portable-${{ steps.identity.outputs.version }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 14
      - name: Attest the portable archive
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3.1.0
        with:
          subject-path: release-assets/omm-windows-x64-${{ steps.identity.outputs.version }}.zip

  publish:
    name: Publish the validated bundle and GitHub Release
    if: github.event_name != 'pull_request'
    needs: build
    permissions:
      contents: write
    uses: ./.github/workflows/github-release.yml
    with:
      version: ${{ needs.build.outputs.version }}
      asset_set: windows

  verify-winget-install:
    name: Install and uninstall through the published WinGet manifest
    if: >-
      github.event_name != 'pull_request' &&
      needs.publish.outputs.published == 'true'
    needs: [build, publish]
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-portable-${{ needs.build.outputs.version }}
          path: release-assets
      - name: Exercise the published user install and uninstall path
        shell: pwsh
        run: |
          $version = "${{ needs.build.outputs.version }}"
          $manifestPath = "release-assets/winget/manifests/o/OmmHippo/OMM/$version"
          $winget = Get-Command winget -ErrorAction SilentlyContinue
          if ($null -eq $winget) { throw "winget is unavailable on this Windows runner" }
          winget settings --enable LocalManifestFiles
          if ($LASTEXITCODE -ne 0) { throw "could not enable local manifest files" }
          winget install --manifest $manifestPath `
            --silent `
            --accept-package-agreements `
            --accept-source-agreements `
            --disable-interactivity
          if ($LASTEXITCODE -ne 0) { throw "WinGet installation failed" }
          $command = Get-Command omm -ErrorAction Stop
          & $command.Source --version
          if ($LASTEXITCODE -ne 0) { throw "installed command version probe failed" }
          $dataRoot = Join-Path $env:RUNNER_TEMP "omm-winget-user-data"
          New-Item -ItemType Directory -Force -Path $dataRoot | Out-Null
          Set-Content -LiteralPath (Join-Path $dataRoot "preserve-me") -Value "user data"
          $env:OMM_HOME = $dataRoot
          # The package is not in the community source yet, so use the same
          # local manifest for correlation during this pre-submission smoke test.
          winget uninstall --manifest $manifestPath `
            --silent `
            --accept-source-agreements `
            --disable-interactivity
          if ($LASTEXITCODE -ne 0) { throw "WinGet uninstall failed" }
          if (Get-Command omm -ErrorAction SilentlyContinue) {
            throw "omm command remains exposed after WinGet uninstall"
          }
          if (-not (Test-Path -LiteralPath (Join-Path $dataRoot "preserve-me"))) {
            throw "WinGet uninstall removed user data"
          }
