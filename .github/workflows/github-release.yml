name: Publish a GitHub Release with validated assets

"on":
  workflow_call:
    inputs:
      version:
        description: Signed OMM release version, without the v prefix
        required: true
        type: string
      asset_set:
        description: Validated artifact set to add (python or windows)
        required: true
        type: string
    outputs:
      published:
        description: Whether this call observed and published all five assets
        value: ${{ jobs.release.outputs.published }}

permissions:
  contents: read

concurrency:
  group: github-release-v${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish the asset-backed Release for a signed tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      published: ${{ steps.publish_state.outputs.published }}
    steps:
      - name: Check out trusted release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tooling
          persist-credentials: false
      - name: Check out the signed release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          fetch-depth: 0
          persist-credentials: false
          ref: refs/tags/v${{ inputs.version }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Verify the signed release identity
        run: >-
          python tooling/scripts/release_artifacts.py verify-release
          --tag "v${{ inputs.version }}"
          --repository source
      - name: Download the validated Python bundle
        if: inputs.asset_set == 'python'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-release-dist
          path: release-assets
      - name: Download the validated Windows bundle
        if: inputs.asset_set == 'windows'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-portable-${{ inputs.version }}
          path: release-assets
      - name: Publish only after all five immutable assets are present
        id: publish_state
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
          ASSET_SET: ${{ inputs.asset_set }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          case "${ASSET_SET}" in
            python)
              current_assets=(
                "omm_model-${VERSION}-py3-none-any.whl"
                "omm_model-${VERSION}.tar.gz"
                "SHA256SUMS"
              )
              ;;
            windows)
              current_assets=(
                "omm-windows-x64-${VERSION}.zip"
                "omm-windows-x64-${VERSION}.zip.sha256"
              )
              ;;
            *)
              echo "unsupported release asset set: ${ASSET_SET}" >&2
              exit 1
              ;;
          esac
          all_assets=(
            "omm_model-${VERSION}-py3-none-any.whl"
            "omm_model-${VERSION}.tar.gz"
            "SHA256SUMS"
            "omm-windows-x64-${VERSION}.zip"
            "omm-windows-x64-${VERSION}.zip.sha256"
          )

          python tooling/scripts/release_artifacts.py verify-release-assets \
            --dist-dir release-assets --version "${VERSION}" --asset-set "${ASSET_SET}"

          release_json="$(
            gh api --paginate --slurp "repos/${GH_REPO}/releases?per_page=100" |
              jq --arg tag "${tag}" '[.[][] | select(.tag_name == $tag)]'
          )"
          release_count="$(printf '%s' "${release_json}" | jq 'length')"
          if [ "${release_count}" = "0" ]; then
            gh release create "${tag}" \
              --repo "${GH_REPO}" \
              --draft \
              --title "OMM ${tag}" \
              --generate-notes \
              --verify-tag
            release_json="$(
              gh api --paginate --slurp "repos/${GH_REPO}/releases?per_page=100" |
                jq --arg tag "${tag}" '[.[][] | select(.tag_name == $tag)]'
            )"
            release_count="$(printf '%s' "${release_json}" | jq 'length')"
          fi
          if [ "${release_count}" != "1" ]; then
            echo "expected exactly one GitHub Release for ${tag}" >&2
            exit 1
          fi
          release_id="$(printf '%s' "${release_json}" | jq -r '.[0].id')"
          is_draft="$(printf '%s' "${release_json}" | jq -r '.[0].draft')"
          if [ "${is_draft}" != "true" ]; then
            existing_names="$(printf '%s' "${release_json}" | jq -c '[.[0].assets[].name] | sort')"
            expected_names="$(printf '%s\n' "${all_assets[@]}" | jq -Rsc 'split("\n")[:-1] | sort')"
            if [ "${existing_names}" != "${expected_names}" ]; then
              echo "published release has an incomplete or unexpected asset set; refusing to modify it" >&2
              exit 1
            fi
          fi

          for asset in "${current_assets[@]}"
          do
            test -f "release-assets/${asset}"
            test ! -L "release-assets/${asset}"
            count="$(gh api "repos/${GH_REPO}/releases/${release_id}" \
              --jq "[.assets[] | select(.name == \"${asset}\")] | length")"
            if [ "${count}" = "0" ]; then
              gh release upload "${tag}" "release-assets/${asset}" --repo "${GH_REPO}"
            elif [ "${count}" = "1" ]; then
              mkdir -p downloaded
              gh release download "${tag}" --repo "${GH_REPO}" \
                --pattern "${asset}" --dir downloaded --clobber
              cmp "release-assets/${asset}" "downloaded/${asset}"
            else
              echo "release contains duplicate asset names for ${asset}" >&2
              exit 1
            fi
          done

          mkdir -p uploaded-assets
          for asset in "${current_assets[@]}"
          do
            gh release download "${tag}" --repo "${GH_REPO}" \
              --pattern "${asset}" --dir uploaded-assets --clobber
            cmp "release-assets/${asset}" "uploaded-assets/${asset}"
          done

          complete="true"
          for asset in "${all_assets[@]}"
          do
            count="$(gh api "repos/${GH_REPO}/releases/${release_id}" \
              --jq "[.assets[] | select(.name == \"${asset}\")] | length")"
            if [ "${count}" = "0" ]; then
              complete="false"
            elif [ "${count}" != "1" ]; then
              echo "release contains duplicate asset names for ${asset}" >&2
              exit 1
            fi
          done
          if [ "${complete}" != "true" ]; then
            echo "Release ${tag} remains draft until all five validated assets arrive."
            echo "published=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          mkdir -p published-assets
          for asset in "${all_assets[@]}"
          do
            gh release download "${tag}" --repo "${GH_REPO}" \
              --pattern "${asset}" --dir published-assets --clobber
          done
          python tooling/scripts/release_artifacts.py verify-release-assets \
            --dist-dir published-assets --version "${VERSION}"

          for asset in "${current_assets[@]}"
          do
            cmp "release-assets/${asset}" "published-assets/${asset}"
          done

          asset_count="$(gh api "repos/${GH_REPO}/releases/${release_id}" --jq '.assets | length')"
          test "${asset_count}" = "5"
          if [ "${is_draft}" = "true" ]; then
            gh release edit "${tag}" --repo "${GH_REPO}" --draft=false
          fi
          echo "published=true" >> "${GITHUB_OUTPUT}"

  verify-winget-install:
    name: Install and uninstall through the published WinGet manifest
    if: >-
      needs.release.outputs.published == 'true'
    needs: release
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tooling
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          persist-credentials: false
          ref: refs/tags/v${{ inputs.version }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Build the manifest from the published Windows bytes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: |
          $version = $env:VERSION
          $archiveName = "omm-windows-x64-$version.zip"
          gh release download "v$version" --repo $env:GH_REPO `
            --pattern $archiveName --pattern "$archiveName.sha256" --dir release-assets
          if ($LASTEXITCODE -ne 0) { throw "could not download the published Windows assets" }
          python tooling/scripts/release_artifacts.py verify-release-assets `
            --dist-dir release-assets --version $version --asset-set windows
          if ($LASTEXITCODE -ne 0) { throw "published Windows checksum verification failed" }
          $archive = "release-assets/$archiveName"
          gh attestation verify $archive --repo $env:GH_REPO
          if ($LASTEXITCODE -ne 0) { throw "published Windows attestation verification failed" }
          $releaseDate = git -C source show -s --format=%cs HEAD
          if ($LASTEXITCODE -ne 0) { throw "could not resolve the release date" }
          python tooling/scripts/winget_manifest.py `
            --version $version --archive $archive --release-date $releaseDate `
            --installer-url "https://github.com/omm-hippo/omm/releases/download/v$version/$archiveName" `
            --output-dir release-assets/winget
          if ($LASTEXITCODE -ne 0) { throw "published Windows manifest validation failed" }
      - name: Exercise the published user install and uninstall path
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}"
          $manifestPath = "release-assets/winget/manifests/o/OmmHippo/OMM/$version"
          $winget = Get-Command winget -ErrorAction SilentlyContinue
          if ($null -eq $winget) { throw "winget is unavailable on this Windows runner" }
          winget settings --enable LocalManifestFiles
          if ($LASTEXITCODE -ne 0) { throw "could not enable local manifest files" }
          winget install --manifest $manifestPath `
            --silent `
            --accept-package-agreements `
            --accept-source-agreements `
            --disable-interactivity
          if ($LASTEXITCODE -ne 0) { throw "WinGet installation failed" }
          $command = Get-Command omm -ErrorAction Stop
          $actualVersion = & $command.Source --version
          if ($LASTEXITCODE -ne 0 -or ($actualVersion | Out-String).Trim() -ne "omm $version") {
            throw "installed command does not report the published version: $actualVersion"
          }
          $dataRoot = Join-Path $env:RUNNER_TEMP "omm-winget-user-data"
          New-Item -ItemType Directory -Force -Path $dataRoot | Out-Null
          Set-Content -LiteralPath (Join-Path $dataRoot "preserve-me") -Value "user data"
          $env:OMM_HOME = $dataRoot
          # The package is not in the community source yet, so use the same
          # local manifest for correlation during this pre-submission smoke test.
          winget uninstall --manifest $manifestPath `
            --silent `
            --accept-source-agreements `
            --disable-interactivity
          if ($LASTEXITCODE -ne 0) { throw "WinGet uninstall failed" }
          if (Get-Command omm -ErrorAction SilentlyContinue) {
            throw "omm command remains exposed after WinGet uninstall"
          }
          if (-not (Test-Path -LiteralPath (Join-Path $dataRoot "preserve-me"))) {
            throw "WinGet uninstall removed user data"
          }
